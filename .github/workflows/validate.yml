# Marketplace validation for wingman-agents.
#
# Scope: this repo only. Wingman-repo paths referenced by skills (pnpm scripts,
# specs/, .specify/) CANNOT be verified here and are deliberately out of scope —
# the wingman repo's check:docs/check:agents gates own those.
name: validate

on:
  push:
  pull_request:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Version consistency (bumpVersion.sh --check)
        run: sh bumpVersion.sh --check

      - name: Official plugin validation (claude plugin validate --strict)
        # The same check `claude plugin validate` runs locally in ~2s. If this
        # step proves unable to run headless in CI, replace it with a comment
        # recording WHAT failed — never silently drop it.
        run: |
          set -eu
          npm install -g @anthropic-ai/claude-code
          claude plugin validate ./plugins/wingman --strict

      - name: Bump-on-change
        env:
          EVENT_NAME: ${{ github.event_name }}
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PUSH_BEFORE_SHA: ${{ github.event.before }}
        run: |
          set -eu
          if [ "$EVENT_NAME" = "pull_request" ]; then
            BASE=$(git merge-base "$PR_BASE_SHA" HEAD)
          else
            BASE="$PUSH_BEFORE_SHA"
          fi
          # First push of a branch / force-push: before-SHA is unusable -> previous commit.
          if [ -z "$BASE" ] || [ "$BASE" = "0000000000000000000000000000000000000000" ] || ! git cat-file -e "$BASE" 2>/dev/null; then
            BASE=$(git rev-parse HEAD~1 2>/dev/null || true)
          fi
          if [ -z "$BASE" ]; then
            echo "single-commit history; skipping bump-on-change"
            exit 0
          fi
          echo "comparing against base $BASE"
          CHANGED=$(git diff --name-only "$BASE"..HEAD)
          fail=0
          for dir in plugins/*/; do
            name=$(basename "$dir")
            if printf '%s\n' "$CHANGED" | grep -q "^plugins/$name/"; then
              new=$(jq -r .version "plugins/$name/.claude-plugin/plugin.json")
              old=$(git show "$BASE:plugins/$name/.claude-plugin/plugin.json" 2>/dev/null | jq -r .version || true)
              if [ -n "$old" ] && [ "$old" != "null" ] && [ "$old" = "$new" ]; then
                echo "::error::plugin '$name' has changes since $BASE but its version is still $new — run bumpVersion.sh $name"
                fail=1
              fi
            fi
          done
          exit $fail

      - name: Manifest well-formedness
        run: |
          set -eu
          fail=0
          for f in plugins/*/.claude-plugin/plugin.json plugins/*/.codex-plugin/plugin.json; do
            if ! jq -e '.name and .version' "$f" >/dev/null; then
              echo "::error::$f is not valid JSON with required fields name+version"
              fail=1
            fi
          done
          # Marketplace manifests: shapes differ by design (the .agents one carries
          # no version field — see README.md) so require only valid JSON + names.
          for f in .claude-plugin/marketplace.json .agents/plugins/marketplace.json; do
            if ! jq -e '.plugins | map(.name) | all(length > 0)' "$f" >/dev/null; then
              echo "::error::$f failed JSON/name validation"
              fail=1
            fi
          done
          exit $fail

      - name: Safety language present (coverage-asserted)
        # Wingman is advisory-only aviation software. The skills and roles here
        # carry its load-bearing safety text; an edit that drops it must fail
        # CI, because the wingman repo can no longer see these files. The
        # manifest below is COVERAGE-ASSERTED: every role .md and every
        # SKILL.md must have an entry, so a newly added file fails CI until
        # someone consciously decides what safety text it must carry.
        run: |
          set -eu
          python3 - <<'EOF'
          import pathlib, sys
          MANIFEST = {
              'plugins/wingman/agents/Explore.md': 'callsigns',
              'plugins/wingman/agents/scout.md': 'callsigns',
              'plugins/wingman/agents/mech-executor.md': 'SAFETY AND DATA GUARDRAIL',
              'plugins/wingman/agents/verifier.md': 'exactly',
              'plugins/wingman/agents/deep-thinker.md': 'PROPOSE only',
              'plugins/wingman/skills/wingman-review/SKILL.md': 'advisory-only',
              'plugins/wingman/skills/deep-think/SKILL.md': 'safety',
              'plugins/wingman/skills/handoff/SKILL.md': 'advisory-only',
              'plugins/wingman/skills/resumeFromHandoff/SKILL.md': 'provenance',
              'plugins/wingman/skills/docs-update/SKILL.md': 'safety',
              'plugins/wingman/skills/publish-harness/SKILL.md': 'safety',
          }
          fail = False
          for file, pattern in MANIFEST.items():
              path = pathlib.Path(file)
              if not path.exists():
                  print(f"::error::{file} is in the safety-language manifest but does not exist — remove the entry or restore the file")
                  fail = True
                  continue
              if pattern.lower() not in path.read_text(encoding='utf-8').lower():
                  print(f"::error::{file} no longer contains its required safety text: '{pattern}'")
                  fail = True
          present = [str(p) for pat in ('plugins/*/agents/*.md', 'plugins/*/skills/*/SKILL.md')
                     for p in pathlib.Path('.').glob(pat)]
          for file in present:
              if file not in MANIFEST:
                  print(f"::error::{file} has no entry in the safety-language manifest — add one (this step is coverage-asserted so new files cannot silently skip it)")
                  fail = True
          sys.exit(1 if fail else 0)
          EOF

      - name: wingman-review workflow script parses
        # The ~90-line embedded Workflow script in wingman-review has already
        # produced one real defect (2026-07-22, stringified args -> silent
        # false-negative review). Extract the fenced js block and at least
        # prove it PARSES as ESM (node --check); the workflow globals
        # (agent/pipeline/args) are runtime-provided, so parse is the
        # strongest offline check available.
        run: |
          set -eu
          python3 - <<'EOF'
          import pathlib, re, subprocess, sys, tempfile
          text = pathlib.Path('plugins/wingman/skills/wingman-review/SKILL.md').read_text(encoding='utf-8')
          blocks = re.findall(r'```js\n(.*?)```', text, re.S)
          if len(blocks) != 1:
              print(f"::error::expected exactly one ```js block in wingman-review/SKILL.md, found {len(blocks)}")
              sys.exit(1)
          # The Workflow runtime treats the script as an async function body
          # (top-level `return`/`await` are legal) with `export const meta`
          # handled specially. Mirror that dialect before parsing.
          body = re.sub(r'^export ', '', blocks[0], count=1, flags=re.M)
          wrapped = 'async function __workflow_check() {\n' + body + '\n}\n'
          with tempfile.NamedTemporaryFile(mode='w', suffix='.mjs', delete=False) as f:
              f.write(wrapped)
              path = f.name
          result = subprocess.run(['node', '--check', path], capture_output=True, text=True)
          if result.returncode != 0:
              print(f"::error::wingman-review workflow script fails node --check:\n{result.stderr}")
              sys.exit(1)
          print('wingman-review workflow script parses (async-body dialect)')
          EOF

      - name: Dead references
        run: |
          set -eu
          fail=0
          # 4a: patterns that are dead ANYWHERE. The wingman repo's
          # .claude/agents-available templates were deleted in the marketplace
          # migration; nothing here may still point at them. (.claude/skills and
          # .agents/skills are NOT denylisted — the speckit-* skills legitimately
          # remain repo-local in wingman and skills here may describe that.)
          if grep -rn --include='*.md' -e '\.claude/agents-available' plugins/; then
            echo "::error::dead path pattern found (see grep hits above)"
            fail=1
          fi
          # 4b: intra-repo references must exist (markdown links + backticked plugins/ paths).
          python3 - <<'EOF' || fail=1
          import re, sys, pathlib
          bad = []
          for md in pathlib.Path('plugins').rglob('*.md'):
              text = md.read_text(encoding='utf-8', errors='replace')
              for m in re.finditer(r'\]\(([^)#\s]+)\)', text):
                  t = m.group(1)
                  if t.startswith(('http://', 'https://', 'mailto:')):
                      continue
                  if any(c in t for c in '<>*{'):
                      continue
                  target = (md.parent / t) if not t.startswith('plugins/') else pathlib.Path(t)
                  if not target.exists():
                      bad.append(f"{md}: broken link -> {t}")
              for m in re.finditer(r'`(plugins/[^`\s]+)`', text):
                  t = m.group(1).rstrip('/')
                  if any(c in t for c in '<>*{'):
                      continue
                  if not pathlib.Path(t).exists():
                      bad.append(f"{md}: backticked path missing -> {t}")
          for b in bad:
              print(f"::error::{b}")
          sys.exit(1 if bad else 0)
          EOF
          exit $fail
